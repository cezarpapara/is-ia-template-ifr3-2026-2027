name: Verify application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL integration, migrations, concurrency and coverage
        run: docker compose -f compose.test.yaml run --build --rm tests
      - name: Remove disposable databases
        if: always()
        run: docker compose -f compose.test.yaml down --volumes

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=high

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated API
        run: docker compose -f compose.test.yaml up --build --detach --wait e2e-api
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Remove disposable databases
        if: always()
        run: docker compose -f compose.test.yaml down --volumes
